/*

 *   1. Googleスプレッドシートを新規作成
 *   2. 拡張機能 > Apps Script を開き、gas-code.gs の内容を貼り付け
 *   3. 「デプロイ」→「新しいデプロイ」→ 種類「ウェブアプリ」
 *      - 実行するユーザー: 自分
 *      - アクセスできるユーザー: 組織内の全員（または全員）
 *   4. 発行されたウェブアプリURL（.../exec）を下記 GAS_ENDPOINT に設定
 *
 * 未設定（空文字）のままでもアプリは動作しますが、その場合は
 * ブラウザのlocalStorageのみに保存され、他の端末とは共有されません。
 */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzsJAU1lqNkaTFf9NM4uNeTnq5mwrsZBEh8-eitr8RT8RQExJ3Ys8mBxW_qAUhZPT8X/exec"; // 営業推進本部 販管費管理DB（デプロイ済み）

// App本体の STORAGE_PREFIX_HD / STORAGE_PREFIX_COMPANY と同じ値
const LOCAL_PREFIX_HD = "chibo-sgcost:";
const LOCAL_PREFIX_COMPANY = "chibo-sgcost-company:";
// スプレッドシート側のキー接頭辞。千房HD(株)は既存データとの後方互換のため無接頭辞、
// 千房(株)は新規のため "company:" を付けて区別する
const REMOTE_PREFIX_COMPANY = "company:";
function isGasConfigured() {
  return typeof GAS_ENDPOINT === "string" && GAS_ENDPOINT.trim().length > 0;
}

// ローカルキー（"chibo-sgcost:2026-04" 等）→ スプレッドシート側のキーへ変換
function toRemoteKey(localKey) {
  if (localKey.startsWith(LOCAL_PREFIX_COMPANY)) {
    return REMOTE_PREFIX_COMPANY + localKey.slice(LOCAL_PREFIX_COMPANY.length);
  }
  if (localKey.startsWith(LOCAL_PREFIX_HD)) {
    return localKey.slice(LOCAL_PREFIX_HD.length);
  }
  return localKey;
}

// スプレッドシート側のキー → ローカルキーへ変換（同期時に使用）
function fromRemoteKey(remoteKey) {
  if (remoteKey.startsWith(REMOTE_PREFIX_COMPANY)) {
    return LOCAL_PREFIX_COMPANY + remoteKey.slice(REMOTE_PREFIX_COMPANY.length);
  }
  return LOCAL_PREFIX_HD + remoteKey;
}
async function gasListAllMonths() {
  const res = await fetch(`${GAS_ENDPOINT}?action=getAll`, {
    method: "GET"
  });
  if (!res.ok) throw new Error("共有スプレッドシートからの取得に失敗しました（HTTP " + res.status + "）");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.months || {};
}
async function gasSaveMonth(remoteKey, payload) {
  const res = await fetch(GAS_ENDPOINT, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: "save",
      key: remoteKey,
      ...payload
    })
  });
  if (!res.ok) throw new Error("共有スプレッドシートへの保存に失敗しました（HTTP " + res.status + "）");
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "共有スプレッドシートへの保存に失敗しました");
  return data;
}

/* ------------------------------------------------------------------ */
/*  window.storage シム                                                */
/*  ・GAS_ENDPOINT設定時：Googleスプレッドシートを正とし、               */
/*    localStorageは表示高速化のためのローカルキャッシュとして使用       */
/*  ・GAS_ENDPOINT未設定時：localStorageのみで動作（この端末専用）       */
/*  App本体（get/set/list）のインターフェースは変更していない            */
/*  ・千房HD(株)と千房(株)の2エンティティを同じスプレッドシートで扱う。   */
/*    千房HD(株)は既存データとの互換のため無接頭辞キー、千房(株)は       */
/*    "company:" 接頭辞キーとして保存する（App側からは意識不要）         */
/* ------------------------------------------------------------------ */

(function installStorageShim() {
  const LS_PREFIX = "chibo-sgcost-storage:";
  let remoteAvailable = null; // null=未確認, true=接続成功, false=接続失敗
  let syncPromise = null; // 同一セッション内でのGAS一括取得を1回に抑える

  function fullKey(key, shared) {
    return LS_PREFIX + (shared ? "shared:" : "local:") + key;
  }
  async function syncFromRemoteOnce() {
    if (!isGasConfigured()) {
      remoteAvailable = false;
      return;
    }
    if (!syncPromise) {
      syncPromise = (async () => {
        try {
          const months = await gasListAllMonths();
          Object.keys(months).forEach(remoteKey => {
            const localKey = fromRemoteKey(remoteKey);
            window.localStorage.setItem(fullKey(localKey, false), JSON.stringify(months[remoteKey]));
          });
          remoteAvailable = true;
        } catch (err) {
          remoteAvailable = false;
          console.warn("共有スプレッドシートへの接続に失敗しました。ローカルデータを表示します。", err);
        }
      })();
    }
    await syncPromise;
  }
  window.storage = {
    getStatus() {
      if (!isGasConfigured()) return "unconfigured";
      if (remoteAvailable === true) return "connected";
      if (remoteAvailable === false) return "local-only";
      return "checking";
    },
    async get(key, shared = false) {
      const raw = window.localStorage.getItem(fullKey(key, shared));
      if (raw === null) return null;
      return {
        key,
        value: raw,
        shared
      };
    },
    async set(key, value, shared = false) {
      // 常にローカルキャッシュへ即時保存（オフライン時でも表示は即時反映される）
      window.localStorage.setItem(fullKey(key, shared), value);
      if (isGasConfigured() && !shared) {
        const remoteKey = toRemoteKey(key);
        const payload = JSON.parse(value);
        await gasSaveMonth(remoteKey, payload); // 失敗時はここで例外を投げる
        remoteAvailable = true;
      }
      return {
        key,
        value,
        shared
      };
    },
    async delete(key, shared = false) {
      const existed = window.localStorage.getItem(fullKey(key, shared)) !== null;
      window.localStorage.removeItem(fullKey(key, shared));
      return {
        key,
        deleted: existed,
        shared
      };
    },
    async list(prefix = "", shared = false) {
      // 起動時：GAS設定があればスプレッドシートの内容でローカルキャッシュを更新（1セッション1回のみ）
      if (!shared) {
        await syncFromRemoteOnce();
      }
      const searchPrefix = LS_PREFIX + (shared ? "shared:" : "local:") + prefix;
      const stripLen = (LS_PREFIX + (shared ? "shared:" : "local:")).length;
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith(searchPrefix)) {
          keys.push(k.slice(stripLen));
        }
      }
      return {
        keys,
        prefix,
        shared
      };
    }
  };
})();

function parseLedgerDate(raw) {
  if (raw === null || raw === undefined || raw === "") return {
    display: "",
    iso: ""
  };
  if (typeof raw === "number") {
    // Excelのシリアル日付（1899-12-30起点）をJSTの日付として解釈
    const ms = Math.round((raw - 25569) * 86400 * 1000);
    const d = new Date(ms);
    const y = d.getUTCFullYear();
    const m = pad2(d.getUTCMonth() + 1);
    const day = pad2(d.getUTCDate());
    return {
      display: `${y}/${m}/${day}`,
      iso: `${y}-${m}-${day}`
    };
  }
  const s = String(raw).trim();
  // 和暦表記（R08/06/30 など：令和=R, 平成=H, 昭和=S）
  const eraMatch = s.match(/^([RHS])(\d{2})\/(\d{2})\/(\d{2})$/);
  if (eraMatch) {
    const eraOffset = {
      R: 2018,
      H: 1988,
      S: 1925
    }[eraMatch[1]] || 0;
    const year = eraOffset + parseInt(eraMatch[2], 10);
    return {
      display: `${year}/${eraMatch[3]}/${eraMatch[4]}`,
      iso: `${year}-${eraMatch[3]}-${eraMatch[4]}`
    };
  }
  const plainMatch = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (plainMatch) {
    const [, y, m, d] = plainMatch;
    return {
      display: `${y}/${pad2(+m)}/${pad2(+d)}`,
      iso: `${y}-${pad2(+m)}-${pad2(+d)}`
    };
  }
  return {
    display: s,
    iso: ""
  };
}

/* ---- 明細行の集計ロジック（元帳形式 → 科目別・細目別 月計 ＋ 個別取引明細） ---- */
function aggregateRows(rows) {
  const totals = {};

  let curSub = null;

    if (typeof v === "number") return v;

    return isNaN(n) ? 0 : n;

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const col0 = row[0];
    const isHeader = col0 !== null && col0 !== undefined && String(col0).trim() !== "";
    if (isHeader) {
      const parts = String(col0).trim().split(/\s{2,}/);
      if (parts.length >= 2) {
        const m = parts[1].match(/^(\S+)\s+(.+)$/);
        if (m) {
          curAccount = m[2].trim();
          codes[curAccount] = m[1];
        } else {
          curAccount = parts[1].trim();
        }
      }
      if (parts.length >= 3) {
        const m2 = parts[2].match(/^(\S+)\s+(.+)$/);
        curSub = m2 ? m2[2].trim() : parts[2].trim();
      } else {
        curSub = "その他";
      }
      lines[curAccount] = lines[curAccount] || {};
      lines[curAccount][curSub] = lines[curAccount][curSub] || [];
    } else {
      const summary = row[6];

const EXCLUDED_COMPANY_DEPT_CODES = new Set(["0702", "0704", "0750", "0800"]);
function aggregateCompanyRows(rows) {
  const totals = {};
  const detail = {};
  const lines = {};
  const prototypeLines = [];
  let curDeptCode = null;
  let curDept = null;
  let curAccount = null;
  let curSub = null;
  let prototypeCost = 0;
  const toNum = v => {
    if (typeof v === "number") return v;
    const n = parseFloat(String(v ?? "0").replace(/,/g, ""));
    return isNaN(n) ? 0 : n;
  };
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const col0 = row[0];
    const isHeader = col0 !== null && col0 !== undefined && String(col0).trim() !== "";
    if (isHeader) {
      const parts = String(col0).trim().split(/\s{2,}/);
      if (parts.length >= 1) {
        const m0 = parts[0].match(/^(\S+)\s+(.+)$/);
        curDeptCode = m0 ? m0[1].trim() : null;
        curDept = m0 ? m0[2].trim() : parts[0].trim();
      }
      if (parts.length >= 2) {
        const m = parts[1].match(/^(\S+)\s+(.+)$/);
        curAccount = m ? m[2].trim() : parts[1].trim();
      }
      if (parts.length >= 3) {
        const m2 = parts[2].match(/^(\S+)\s+(.+)$/);
        curSub = m2 ? m2[2].trim() : parts[2].trim();
      } else {
        curSub = "その他";
      }
      lines[curAccount] = lines[curAccount] || {};
      lines[curAccount][curSub] = lines[curAccount][curSub] || [];
    } else {
      const summary = row[6];
      const excluded = EXCLUDED_COMPANY_DEPT_CODES.has(curDeptCode);
      const isPrototypeLine = curDept === PROTOTYPE_DEPT && curAccount === PROTOTYPE_ACCOUNT && curSub === PROTOTYPE_SUB;
      if (summary === "※※月計※※" && curAccount) {
        const val = toNum(row[9]) - toNum(row[10]);
        if (isPrototypeLine) {
          prototypeCost += val; // 試作費用は部門除外の対象外（営業本部共通は常に含む）
        }
        if (!excluded) {
          totals[curAccount] = (totals[curAccount] || 0) + val;
          detail[curAccount] = detail[curAccount] || {};
          const subKey = curSub || "その他";
          detail[curAccount][subKey] = (detail[curAccount][subKey] || 0) + val;
        }
      } else if (summary && summary !== "前月より繰越" && curAccount) {
        const debit = toNum(row[9]);
        const credit = toNum(row[10]);
        if (isPrototypeLine) {
          const {
            display: pDisplay
          } = parseLedgerDate(row[3]);
          prototypeLines.push({
            date: pDisplay,
            desc: String(summary),
            amount: debit - credit
          });
        }
        if (!excluded) {
          const {
            display,
            iso
          } = parseLedgerDate(row[3]);
          const subKey = curSub || "その他";
          lines[curAccount] = lines[curAccount] || {};
          lines[curAccount][subKey] = lines[curAccount][subKey] || [];
          lines[curAccount][subKey].push({
            date: display,
            dateIso: iso,
            desc: String(summary),
            debit,
            credit,
            amount: debit - credit
          });
        }
      }
    }
  }
  return {
    totals,
    detail,
    lines,
    prototypeCost,
    prototypeLines
  };
}
function parseFilenameYearMonth(name) {
  const m = name.match(/(20\d{2})\D{1,3}(\d{1,2})\D/);
  if (m) {
    const year = parseInt(m[1], 10);
    const month = parseInt(m[2], 10);
    if (month >= 1 && month <= 12) return {
      year,
      month
    };
  }
  return null;
}
async function readXlsxRows(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {
    type: "array"
  });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {
    header: 1,
    raw: true,
    defval: null
  });
}
async function readCsvRows(file) {
  const buf = await file.arrayBuffer();
  let text;
  try {
    text = new TextDecoder("shift_jis").decode(buf);
  } catch {
    text = new TextDecoder("utf-8").decode(buf);
  }
  const parsed = Papa.parse(text, {
    skipEmptyLines: false
  });
  return parsed.data;
}
function csvEscape(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function downloadCsv(filename, rows) {
  const content = "\uFEFF" + rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([content], {
    type: "text/csv;charset=utf-8;"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
